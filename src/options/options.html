<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">FB Layout Tweaks Options</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img class="logo-badge" src="../../icons/icon48.png" alt="">
        <div>
          <h1 class="title" data-i18n="optionsTitle">FB Layout Tweaks Options</h1>
          <p class="subtitle" data-i18n="optionsSubtitle">Declutter & customize Facebook navigation</p>
        </div>
      </div>
      <div class="header-action">
        <div class="lang-switch" id="langSwitch" title="Switch language" data-i18n-title="langToggleTitle">
          <button type="button" class="lang-segment" data-lang="en">EN</button>
          <button type="button" class="lang-segment" data-lang="zh_TW">繁中</button>
        </div>
        <span class="master-status-label" id="masterStatus" data-i18n="statusActive">Active</span>
        <label class="switch main-toggle" data-i18n-title="masterToggleTitle" title="Master Toggle">
          <input type="checkbox" id="enabled" aria-label="Toggle Extension Master Switch">
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- UI Hide List -->
    <div class="features-list" id="uiCleanList">

      <!-- Card: Top Navigation -->
      <section class="section-card">

        <!-- Group: Top Navigation -->
        <div class="group-header">
          <div class="group-title" data-i18n="groupTopNav">Top Navigation</div>
          <div class="group-actions">
            <button class="btn-action" id="btnTopReset" data-i18n="btnRecommended" data-i18n-title="btnTopResetTitle"
              title="Restore recommended top navigation defaults">Recommended</button>
            <button class="btn-action" id="btnTopHideAll" data-i18n="btnHideAll" data-i18n-title="btnTopHideAllTitle"
              title="Hide all top navigation items">Hide All</button>
            <button class="btn-action" id="btnTopShowAll" data-i18n="btnShowAll" data-i18n-title="btnTopShowAllTitle"
              title="Show all top navigation items">Show All</button>
          </div>
        </div>

        <!-- Pill grid: checked = visible -->
        <div class="pill-grid">
          <span class="pill pill-locked" title="固定顯示（鎖定）" data-i18n-title="badgeAlwaysShown">
            <span class="pill-icon">🏠</span>
            <span class="pill-label" data-i18n="itemHome">Home</span>
            <span class="pill-lock">🔒</span>
          </span>
          <label class="pill">
            <input type="checkbox" id="showTopReels" aria-label="Toggle Top Reels">
            <span class="pill-icon">🎬</span>
            <span class="pill-label" data-i18n="itemReels">Reels</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showTopMarketplace" aria-label="Toggle Top Marketplace">
            <span class="pill-icon">🛒</span>
            <span class="pill-label" data-i18n="itemMarketplace">Marketplace</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showTopGroups" aria-label="Toggle Top Groups">
            <span class="pill-icon">👥</span>
            <span class="pill-label" data-i18n="itemGroups">Groups</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showTopGaming" aria-label="Toggle Top Gaming">
            <span class="pill-icon">🎮</span>
            <span class="pill-label" data-i18n="itemGaming">Gaming</span>
          </label>
        </div>

      </section>

      <!-- Card: Left Sidebar -->
      <section class="section-card">

        <!-- Group: Left Sidebar -->
        <div class="group-header">
          <div class="group-title" data-i18n="groupLeftSidebar">Left Sidebar</div>
          <div class="group-actions">
            <button class="btn-action" id="btnLeftReset" data-i18n="btnRecommended" data-i18n-title="btnLeftResetTitle"
              title="Restore recommended left sidebar defaults">Recommended</button>
            <button class="btn-action" id="btnLeftHideAll" data-i18n="btnHideAll" data-i18n-title="btnLeftHideAllTitle"
              title="Hide all left sidebar items">Hide All</button>
            <button class="btn-action" id="btnLeftShowAll" data-i18n="btnShowAll" data-i18n-title="btnLeftShowAllTitle"
              title="Show all left sidebar items">Show All</button>
          </div>
        </div>

        <!-- Pill grid: checked = visible (directly under header so Recommended stays close) -->
        <div class="pill-grid">
          <span class="pill pill-locked" title="固定顯示（鎖定）" data-i18n-title="badgeAlwaysShown">
            <span class="pill-icon">👤</span>
            <span class="pill-label" data-i18n="itemProfile">Profile</span>
            <span class="pill-lock">🔒</span>
          </span>
          <label class="pill">
            <input type="checkbox" id="showLeftMetaAI" aria-label="Toggle Left Meta AI">
            <span class="pill-icon">🤖</span>
            <span class="pill-label" data-i18n="itemMetaAI">Meta AI</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftFriends" aria-label="Toggle Left Friends">
            <span class="pill-icon">👥</span>
            <span class="pill-label" data-i18n="itemFriends">Friends</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftMemories" aria-label="Toggle Left Memories">
            <span class="pill-icon">⏰</span>
            <span class="pill-label" data-i18n="itemMemories">Memories</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftSaved" aria-label="Toggle Left Saved">
            <span class="pill-icon">🔖</span>
            <span class="pill-label" data-i18n="itemSaved">Saved</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftGroups" aria-label="Toggle Left Groups">
            <span class="pill-icon">👥</span>
            <span class="pill-label" data-i18n="itemGroups">Groups</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftReels" aria-label="Toggle Left Reels">
            <span class="pill-icon">🎬</span>
            <span class="pill-label" data-i18n="itemReels">Reels</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftMarketplace" aria-label="Toggle Left Marketplace">
            <span class="pill-icon">🛒</span>
            <span class="pill-label" data-i18n="itemMarketplace">Marketplace</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftBirthdays" aria-label="Toggle Left Birthdays">
            <span class="pill-icon">🎂</span>
            <span class="pill-label" data-i18n="itemBirthdays">Birthdays</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftRecentAdActivity" aria-label="Toggle Left Recent Ad Activity">
            <span class="pill-icon">🎯</span>
            <span class="pill-label" data-i18n="itemRecentAdActivity">Recent Ad Activity</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftGaming" aria-label="Toggle Left Gaming">
            <span class="pill-icon">🎮</span>
            <span class="pill-label" data-i18n="itemGaming">Gaming</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftEvents" aria-label="Toggle Left Events">
            <span class="pill-icon">📅</span>
            <span class="pill-label" data-i18n="itemEvents">Events</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftOrdersPayments" aria-label="Toggle Left Orders & Payments">
            <span class="pill-icon">💳</span>
            <span class="pill-label" data-i18n="itemOrdersPayments">Orders & Payments</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftPages" aria-label="Toggle Left Pages">
            <span class="pill-icon">🚩</span>
            <span class="pill-label" data-i18n="itemPages">Pages</span>
          </label>
          <span class="pill pill-locked" title="固定顯示（鎖定）" data-i18n-title="badgeAlwaysShown">
            <span class="pill-icon">📰</span>
            <span class="pill-label" data-i18n="itemFeeds">Feeds</span>
            <span class="pill-lock">🔒</span>
          </span>
          <label class="pill">
            <input type="checkbox" id="showLeftProfessionalDashboard" aria-label="Toggle Left Professional Dashboard">
            <span class="pill-icon">📈</span>
            <span class="pill-label" data-i18n="itemProfessionalDashboard">Professional Dashboard</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftGamingVideo" aria-label="Toggle Left Gaming Video">
            <span class="pill-icon">👾</span>
            <span class="pill-label" data-i18n="itemGamingVideo">Gaming Video</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftAdsManager" aria-label="Toggle Left Ads Manager">
            <span class="pill-icon">📊</span>
            <span class="pill-label" data-i18n="itemAdsManager">Ads Manager</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftMessenger" aria-label="Toggle Left Messenger">
            <span class="pill-icon">💬</span>
            <span class="pill-label" data-i18n="itemMessenger">Messenger</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftMessengerKids" aria-label="Toggle Left Messenger Kids">
            <span class="pill-icon">🧒</span>
            <span class="pill-label" data-i18n="itemMessengerKids">Messenger Kids</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftMetaQuest" aria-label="Toggle Left Meta Quest">
            <span class="pill-icon">🥽</span>
            <span class="pill-label" data-i18n="itemMetaQuest">Meta Quest</span>
          </label>
          <label class="pill">
            <input type="checkbox" id="showLeftFundraisers" aria-label="Toggle Left Fundraisers">
            <span class="pill-icon">🎗️</span>
            <span class="pill-label" data-i18n="itemFundraisers">Fundraisers</span>
          </label>
        </div>

        <hr class="section-divider">

        <!-- Icon-only Sidebar: feature switch (toggle, not a visibility pill) -->
        <div class="feature-item">
          <div class="feature-meta">
            <span class="feature-icon">✨</span>
            <div class="feature-title" data-i18n="itemHoverExpandLeftRail">Icon-only Sidebar (Floating labels on hover)</div>
          </div>
          <div class="feature-action">
            <label class="switch">
              <input type="checkbox" id="hoverExpandLeftRail" aria-label="Toggle Icon-only Sidebar Floating labels on hover">
              <span class="slider round"></span>
            </label>
          </div>
        </div>

        <!-- Left Sidebar Width Controller -->
        <div class="width-control-card">          <div class="width-control-header">
            <div class="width-control-label">
              <span class="feature-icon">↔️</span>
              <span data-i18n="labelLeftWidth">Sidebar Width</span>
            </div>
            <span class="width-value-badge" id="leftWidthValue">360px</span>
          </div>
          <div class="width-slider-row">
            <input type="range" id="leftWidthSlider" min="0" max="360" step="10" value="360" class="width-slider" aria-label="Left Sidebar Width">
          </div>
        </div>

      </section>

    </div>
  </div>

  <script src="../shared/defaults.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="options.js"></script>
</body>

</html>
