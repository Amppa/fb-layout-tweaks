<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Layout Tweaks</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-card">
    <div class="header">
      <div class="brand">
        <img class="logo-badge" src="../../icons/icon48.png" alt="">
        <div>
          <div class="title" data-i18n="popupTitle">FB Layout Tweaks</div>
          <div class="subtitle" data-i18n="popupSubtitle">Minimal Facebook Sidebar</div>
        </div>
      </div>
      <div class="master-wrap">
        <label class="switch" data-i18n-title="popupToggleTitle" title="Toggle Extension">
          <input type="checkbox" id="enableToggle" aria-label="Toggle FB Layout Tweaks">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="sections" id="popupSections">
      <div class="section-row">
        <div class="row-meta">
          <span class="row-icon">⚡</span>
          <div>
            <div class="row-title" data-i18n="popupMinimizeLeft">Minimize Left Sidebar</div>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="hoverExpandLeftRail" aria-label="Toggle Left Sidebar minimize">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="section-row">
        <div class="row-meta">
          <span class="row-icon">⚡</span>
          <div>
            <div class="row-title" data-i18n="popupMinimizeRight">Minimize Right Sidebar</div>
          </div>
        </div>
        <select id="trimRightRail" class="select-dropdown" aria-label="Select right sidebar mode">
          <option value="hidden" data-i18n="optRightRailHidden">Completely Hidden (Default)</option>
          <option value="hover" data-i18n="optRightRailHover">Hover Expand</option>
          <option value="visible" data-i18n="optRightRailVisible">Do Not Hide</option>
        </select>
      </div>
      <div class="section-row">
        <div class="row-meta">
          <span class="row-icon">↔️</span>
          <div>
            <div class="row-title" data-i18n="popupEnlargeFeed">Enlarge Main Feed</div>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="trimMainFeed" aria-label="Toggle Enlarge Main Feed">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="section-row sub-row">
        <div class="row-meta">
          <div>
            <div class="row-title" data-i18n="itemFeedWidth">Feed Width</div>
          </div>
        </div>
        <select id="feedWidth" class="select-dropdown" aria-label="Select feed width">
          <option value="default" data-i18n="optFeedWidthDefault">680px (Original)</option>
          <option value="w50" data-i18n="optFeedWidth50">50%</option>
          <option value="w75" data-i18n="optFeedWidth75">75%</option>
          <option value="w100" data-i18n="optFeedWidth100">100%</option>
        </select>
      </div>
      <div class="section-row sub-row">
        <div class="row-meta">
          <div>
            <div class="row-title" data-i18n="itemFeedMediaHeight">Feed Media Height</div>
          </div>
        </div>
        <select id="feedMediaHeight" class="select-dropdown" aria-label="Select feed media height">
          <option value="h25" data-i18n="optMediaHeight25">25%</option>
          <option value="h50" data-i18n="optMediaHeight50">50%</option>
          <option value="h75" data-i18n="optMediaHeight75">75%</option>
          <option value="default" data-i18n="optMediaHeightDefault">100% (Original)</option>
        </select>
      </div>
      <div class="section-row sub-row">
        <div class="row-meta">
          <div>
            <div class="row-title" data-i18n="itemFeedFontSize">Feed Text Size</div>
          </div>
        </div>
        <select id="feedFontSize" class="select-dropdown" aria-label="Select feed text size">
          <option value="default" data-i18n="optFeedFontDefault">100% (Original)</option>
          <option value="f150" data-i18n="optFeedFont150">150%</option>
          <option value="f200" data-i18n="optFeedFont200">200%</option>
          <option value="f300" data-i18n="optFeedFont300">300%</option>
        </select>
      </div>
    </div>

    <button class="settings-btn" id="openSettingsBtn">
      <span class="btn-icon">⚙️</span>
      <span data-i18n="popupDetailSettings">Detailed Settings</span>
    </button>
    <div class="version-footer">v<span id="popupVersion"></span></div>
  </div>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
