<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Layout Tweaks</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-card">
    <div class="header">
      <div class="brand">
        <img class="logo-badge" src="../../icons/icon48.png" alt="">
        <div>
          <div class="title" data-i18n="popupTitle">FB Layout Tweaks</div>
          <div class="subtitle" data-i18n="popupSubtitle">Minimal Facebook Sidebar</div>
        </div>
      </div>
      <div class="master-wrap">
        <label class="switch" data-i18n-title="popupToggleTitle" title="Toggle Extension">
          <input type="checkbox" id="enableToggle" aria-label="Toggle FB Layout Tweaks">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="sections">
      <div class="section-row">
        <div class="row-meta">
          <span class="row-icon">⚡</span>
          <div>
            <div class="row-title" data-i18n="popupMinimizeLeft">Minimize Left Sidebar</div>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="hoverExpandLeftRail" aria-label="Toggle Left Sidebar minimize">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="section-row">
        <div class="row-meta">
          <span class="row-icon">💬</span>
          <div>
            <div class="row-title" data-i18n="popupMinimizeRight">Minimize Right Sidebar</div>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="trimRightRail" aria-label="Toggle Right Sidebar minimize">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <button class="settings-btn" id="openSettingsBtn">
      <span class="btn-icon">⚙️</span>
      <span data-i18n="popupDetailSettings">Detailed Settings</span>
    </button>
    <div class="version-footer">v<span id="popupVersion"></span></div>
  </div>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
