<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Trim</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-card">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">FT</div>
        <div>
          <div class="title">FB Trim</div>
          <div class="subtitle">Minimal Facebook Sidebar</div>
        </div>
      </div>
      <label class="switch" title="Toggle Extension">
        <input type="checkbox" id="enableToggle">
        <span class="slider round"></span>
      </label>
    </div>

    <button class="settings-btn" id="openSettingsBtn">
      <span class="btn-icon">⚙️</span>
      <span>Open Settings</span>
    </button>
  </div>
  <script src="popup.js"></script>
</body>

</html>
